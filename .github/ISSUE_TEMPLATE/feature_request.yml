name: 功能建议
description: 希望增加或改进的能力
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 请描述"要解决的问题"，而不只是"要什么功能"，这样更容易对齐方案。
  - type: dropdown
    id: component
    attributes:
      label: 涉及组件
      options:
        - 中台（mailu-console）
        - Linux 部署脚本（deploy）
        - 自动部署（bootstrap / fleet-deploy）
        - 文档
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题是
      placeholder: 给 50 个客户开邮箱时，只能一家家手动建域名，容易漏。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的做法
      placeholder: 中台里能一次粘贴多个域名，批量建域名 + 建管理员账号。
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: checkboxes
    id: willing
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 愿意（可以先在 Issue 里讨论实现思路）